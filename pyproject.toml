[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kb-mcp"
version = "0.1.0"
description = "MCP server that exposes a corporate knowledge base (policies, procedures) with RAG and retrieval evals."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sebastián Larrauri" }]
dependencies = [
  "mcp>=2.3,<3",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "fastembed>=0.4",
]

[project.optional-dependencies]
pg = ["psycopg[binary]>=3.2", "pgvector>=0.3"]

[project.scripts]
kb-ingest = "ingest.cli:main"
kb-mcp = "server.app:main"
kb-evals = "evals.harness:main"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "types-pyyaml"]

[tool.hatch.build.targets.wheel]
packages = ["ingest", "server", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=ingest --cov=server --cov=evals --cov-report=term-missing"

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ingest", "server", "evals"]

[[tool.mypy.overrides]]
module = ["fastembed.*", "pgvector.*"]
ignore_missing_imports = true
